name: MySSH
options:
  bundleIdPrefix: com.huangenxu
  deploymentTarget:
    iOS: "17.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.7.0
targets:
  MySSH:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huangenxu.myssh
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MySSH
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
