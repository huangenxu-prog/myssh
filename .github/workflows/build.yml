name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project MySSH.xcodeproj -scheme MySSH -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MySSH.app Payload/
          zip -qr MySSH-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MySSH-unsigned-ipa
          path: MySSH-unsigned.ipa
